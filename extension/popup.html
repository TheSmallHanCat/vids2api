<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2933;
        background: #f8fafc;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #cbd2d9;
        border-radius: 6px;
        font: inherit;
        background: #fff;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px 0;
        border: 0;
        border-radius: 6px;
        background: #1d4ed8;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #94a3b8;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        background: #eef2ff;
        min-height: 16px;
        word-break: break-all;
        white-space: pre-wrap;
      }
      #status.error {
        background: #fef2f2;
        color: #b91c1c;
      }
      .muted {
        color: #64748b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="title">Vids2API 账号池推送</h1>
    <label for="serverUrl" data-i18n="serverLabel">服务器地址</label>
    <input id="serverUrl" placeholder="http://127.0.0.1:8687" />
    <label for="pushToken" data-i18n="tokenLabel">推送令牌</label>
    <input id="pushToken" placeholder="ext_..." />
    <label for="remark" data-i18n="remarkLabel">备注（可选）</label>
    <input id="remark" />
    <button id="push" data-i18n="pushButton">推送当前登录</button>
    <div id="status" class="muted"></div>
    <script src="popup.js"></script>
  </body>
</html>
