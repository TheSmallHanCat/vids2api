<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="生成测试 - Vids2API">生成测试 - Vids2API</title>
  <script src="/static/i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{border:"hsl(0 0% 89%)",input:"hsl(0 0% 89%)",ring:"hsl(0 0% 3.9%)",background:"hsl(0 0% 100%)",foreground:"hsl(0 0% 3.9%)",primary:{DEFAULT:"hsl(0 0% 9%)",foreground:"hsl(0 0% 98%)"},secondary:{DEFAULT:"hsl(0 0% 96.1%)",foreground:"hsl(0 0% 9%)"},muted:{DEFAULT:"hsl(0 0% 96.1%)",foreground:"hsl(0 0% 45.1%)"},destructive:{DEFAULT:"hsl(0 84.2% 60.2%)",foreground:"hsl(0 0% 98%)"}}}}}
  </script>
</head>
<body class="bg-background text-foreground antialiased min-h-screen flex flex-col" data-i18n-page="test">
  <header class="sticky top-0 z-50 border-b border-border/40 bg-background/95 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 h-12 flex items-center gap-4">
      <a href="/manage" class="text-xs text-muted-foreground hover:text-foreground" data-i18n="← 返回控制台">← 返回控制台</a>
      <span class="font-semibold" data-i18n="生成测试">生成测试</span>
    </div>
  </header>
  <main class="max-w-6xl w-full flex-1 mx-auto px-4 py-6 grid lg:grid-cols-2 gap-6">
    <section class="space-y-4">
      <div class="rounded-md border border-border p-5 space-y-4">
        <div class="grid grid-cols-3 gap-2 text-sm" id="kind-tabs">
          <button data-kind="video" class="kind-btn rounded-md px-3 py-2 bg-primary text-primary-foreground font-medium" data-i18n>视频</button>
          <button data-kind="image" class="kind-btn rounded-md px-3 py-2 bg-muted" data-i18n>图片</button>
          <button data-kind="speech" class="kind-btn rounded-md px-3 py-2 bg-muted" data-i18n>语音</button>
        </div>
        <label class="block text-sm space-y-1">
          <span class="text-muted-foreground" data-i18n>提示词</span>
          <textarea id="prompt" rows="4" class="w-full rounded-md bg-background border border-input px-3 py-2 text-sm"></textarea>
        </label>
        <div id="video-options" class="grid grid-cols-3 gap-3 text-sm">
          <label class="space-y-1"><span class="text-muted-foreground" data-i18n>时长（秒）</span>
            <select id="video-seconds" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5">
              <option>3</option><option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option><option>10</option>
            </select></label>
          <label class="space-y-1"><span class="text-muted-foreground" data-i18n>尺寸</span>
            <select id="video-size" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5">
              <option>1280x720</option><option>720x1280</option><option>1920x1080</option><option>1080x1920</option>
            </select></label>
          <label class="space-y-1"><span class="text-muted-foreground" data-i18n>景别</span>
            <select id="video-shot" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5">
              <option value="auto">auto</option><option value="long_take">long_take</option><option value="montage">montage</option>
            </select></label>
        </div>
        <div id="image-options" class="hidden grid grid-cols-3 gap-3 text-sm">
          <label class="space-y-1"><span class="text-muted-foreground" data-i18n>比例</span>
            <select id="image-aspect" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5">
              <option>1:1</option><option>16:9</option><option>9:16</option>
            </select></label>
          <label class="space-y-1"><span class="text-muted-foreground" data-i18n>风格</span>
            <select id="image-style" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5">
              <option>auto</option><option>photography</option><option>background</option>
              <option>vector</option><option>sketch</option><option>watercolor</option><option>cyberpunk</option>
            </select></label>
          <label class="space-y-1"><span class="text-muted-foreground" data-i18n>数量</span>
            <select id="image-count" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5">
              <option>1</option><option>2</option><option>3</option><option>4</option>
            </select></label>
        </div>
        <div id="speech-options" class="hidden text-sm">
          <label class="block space-y-1"><span class="text-muted-foreground" data-i18n>声线</span>
            <select id="speech-voice" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5">
              <option>Puck</option><option>Gacrux</option><option>Algenib</option><option>Charon</option>
              <option>Kore</option><option>Aoede</option><option>Zephyr</option><option>Fenrir</option>
            </select></label>
        </div>
        <div class="flex items-center gap-3 text-sm">
          <label class="flex-1 space-y-1"><span class="text-muted-foreground" data-i18n>幂等键</span>
            <input id="idempotency-key" class="w-full rounded-md bg-background border border-input px-2.5 py-1.5 font-mono text-xs"></label>
          <button id="random-key" class="mt-5 rounded-md border border-input hover:bg-accent px-3 py-1.5 text-xs" data-i18n>随机生成</button>
        </div>
        <p id="test-error" class="hidden text-sm text-destructive"></p>
        <button id="submit" class="w-full rounded-md bg-primary text-primary-foreground hover:bg-primary/90 px-3 py-2.5 text-sm font-medium" data-i18n>提交生成</button>
      </div>
    </section>
    <section class="space-y-4">
      <div class="rounded-md border border-border p-5 space-y-3">
        <h3 class="font-medium" data-i18n>结果</h3>
        <div id="result-empty" class="text-sm text-muted-foreground" data-i18n>暂无数据</div>
        <div id="result-view" class="hidden space-y-3">
          <pre id="result-json" class="text-xs bg-muted border border-border rounded-md p-3 overflow-x-auto max-h-72 whitespace-pre-wrap break-all"></pre>
          <div id="result-media" class="space-y-2"></div>
          <div class="flex gap-2">
            <button id="poll-status" class="rounded-md border border-input hover:bg-accent px-3 py-1.5 text-sm" data-i18n>刷新</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="shrink-0 border-t border-border px-4 py-5 text-center text-xs text-muted-foreground">
    <p>© 2026 <a href="https://linux.do/u/thesmallhancat/summary" target="_blank" rel="noopener noreferrer" class="underline underline-offset-2 hover:opacity-80">TheSmallHanCat</a>. All rights reserved.</p>
  </footer>
  <script src="/static/i18n.js"></script>
  <script>
    const apiRequest = async (url, options = {}) => {
      const headers = { ...I18n.headers(), ...(options.headers || {}) };
      const response = await fetch(url, { credentials: "include", ...options, headers });
      if (response.status === 401) { location.href = "/login"; return null; }
      return response;
    };
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));

    let kind = "video";
    let lastGenerationId = null;

    const randomKey = () => Array.from(crypto.getRandomValues(new Uint8Array(16)))
      .map((b) => b.toString(16).padStart(2, "0")).join("");
    document.getElementById("random-key").addEventListener("click", () => {
      document.getElementById("idempotency-key").value = randomKey();
    });
    document.getElementById("idempotency-key").value = randomKey();

    document.querySelectorAll(".kind-btn").forEach((button) => {
      button.addEventListener("click", () => {
        kind = button.dataset.kind;
        document.querySelectorAll(".kind-btn").forEach((b) => {
          b.classList.toggle("bg-primary", b === button);
          b.classList.toggle("bg-muted", b !== button);
          b.classList.toggle("font-medium", b === button);
          b.classList.toggle("text-primary-foreground", b === button);
        });
        document.getElementById("video-options").classList.toggle("hidden", kind !== "video");
        document.getElementById("image-options").classList.toggle("hidden", kind !== "image");
        document.getElementById("speech-options").classList.toggle("hidden", kind !== "speech");
      });
    });

    function renderResult(payload) {
      document.getElementById("result-empty").classList.add("hidden");
      document.getElementById("result-view").classList.remove("hidden");
      document.getElementById("result-json").textContent = JSON.stringify(payload, null, 2);
      const media = document.getElementById("result-media");
      media.innerHTML = "";
      const id = payload.id || payload?.vids_receipt?.id || lastGenerationId;
      if (!id) return;
      lastGenerationId = id;
      const content = `/v1/vids/generations/${id}/content`;
      const status = payload.status || payload?.vids_receipt?.status;
      if (status === "completed") {
        if (kind === "video") media.innerHTML = `<video controls class="w-full rounded-md" src="${content}"></video>`;
        else if (kind === "image") media.innerHTML = `<img class="max-w-full rounded-md" src="${content}">`;
        else if (kind === "speech") media.innerHTML = `<audio controls class="w-full" src="${content}"></audio>`;
      }
    }

    document.getElementById("submit").addEventListener("click", async () => {
      const error = document.getElementById("test-error");
      error.classList.add("hidden");
      const prompt = document.getElementById("prompt").value.trim();
      if (!prompt) return;
      let url, body;
      if (kind === "video") {
        url = "/v1/videos";
        body = {
          kind: "video", prompt,
          seconds: +document.getElementById("video-seconds").value,
          size: document.getElementById("video-size").value,
          shot_mode: document.getElementById("video-shot").value,
        };
      } else if (kind === "image") {
        url = "/v1/images/generations";
        body = {
          prompt,
          n: +document.getElementById("image-count").value,
          aspect_ratio: document.getElementById("image-aspect").value,
          style: document.getElementById("image-style").value,
        };
      } else {
        url = "/v1/audio/speech";
        body = { input: prompt, voice: document.getElementById("speech-voice").value };
      }
      const submit = document.getElementById("submit");
      submit.disabled = true;
      submit.textContent = I18n.t("生成中...");
      try {
        const response = await apiRequest(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Idempotency-Key": document.getElementById("idempotency-key").value || randomKey(),
          },
          body: JSON.stringify(body),
        });
        if (response.headers.get("X-Vids-Generation-Id")) {
          lastGenerationId = response.headers.get("X-Vids-Generation-Id");
        }
        const contentType = response.headers.get("Content-Type") || "";
        if (contentType.startsWith("audio/")) {
          const blob = await response.blob();
          const audioUrl = URL.createObjectURL(blob);
          document.getElementById("result-empty").classList.add("hidden");
          document.getElementById("result-view").classList.remove("hidden");
          document.getElementById("result-json").textContent = JSON.stringify({ status: "completed", mime: contentType }, null, 2);
          document.getElementById("result-media").innerHTML = `<audio controls class="w-full" src="${audioUrl}"></audio>`;
          return;
        }
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          error.textContent = payload?.error?.message || payload?.detail?.error?.message || I18n.t("提交失败");
          error.classList.remove("hidden");
          if (payload?.vids_receipt) renderResult(payload);
          return;
        }
        renderResult(payload);
      } finally {
        submit.disabled = false;
        submit.textContent = I18n.t("提交生成");
      }
    });

    document.getElementById("poll-status").addEventListener("click", async () => {
      if (!lastGenerationId) return;
      const response = await apiRequest(`/v1/vids/generations/${lastGenerationId}`);
      if (!response || !response.ok) return;
      renderResult(await response.json());
    });
  </script>
</body>
</html>
